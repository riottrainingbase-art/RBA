<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
<rect width="1440" height="1000" fill="#101a20"/>
<style>
text{font-family:"Noto Sans CJK JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.title{font-size:54px;font-weight:900;fill:#f5f6f4}
.sub{font-size:21px;fill:#b8cbd0}
.label{font-size:21px;font-weight:800;fill:#f5f6f4}
.small{font-size:18px;fill:#e1e9e8}
.mini{font-size:16px;fill:#bdced0}
.n{font-size:30px;font-weight:900;fill:#101a20}
</style>
<text x="70" y="72" fill="#9ab9be" font-size="20" letter-spacing="4" font-weight="800">GREAM OKINAWA U13 / PERIODIZATION</text>
<text class="title" x="70" y="145">年間・月間・週間の計画をつなぐ</text>
<text class="sub" x="70" y="188">技術・判断・試合・回復を、一年を通して組み立てる</text>
<text class="label" x="70" y="262">01  年間の4つの時期｜マクロサイクル</text>
<rect x="70" y="284" width="318" height="166" rx="6" fill="#dce9e7"/>
<rect x="397" y="284" width="318" height="166" rx="6" fill="#bfd6d5"/>
<rect x="724" y="284" width="318" height="166" rx="6" fill="#9ebfc2"/>
<rect x="1051" y="284" width="318" height="166" rx="6" fill="#7b9ea5"/>
<g fill="#14262b" font-weight="900"><text x="90" y="329" font-size="27">4–6月</text><text x="417" y="329" font-size="27">7–9月</text><text x="744" y="329" font-size="27">10–12月</text><text x="1071" y="329" font-size="27">1–3月</text><text x="90" y="375" font-size="26">基礎形成</text><text x="417" y="375" font-size="26">発展</text><text x="744" y="375" font-size="26">実戦への応用</text><text x="1071" y="375" font-size="26">定着と評価</text></g>
<g fill="#233c41" font-size="18"><text x="90" y="415">動作・個人技術・1対1</text><text x="417" y="415">数的優位・2対2・3対3</text><text x="744" y="415">攻守の切替・連係</text><text x="1071" y="415">5対5・次年度の課題</text></g>
<rect x="70" y="461" width="1299" height="42" rx="5" fill="#263c44"/>
<text x="720" y="488" text-anchor="middle" font-size="19" fill="#e1eded">年間を通して継続：個人技術 ／ 判断 ／ S&amp;C ／ 安全管理と回復</text>
<text class="label" x="70" y="560">02  4週間の組み立て｜メゾサイクル</text>
<line x1="95" y1="743" x2="1348" y2="743" stroke="#789da3" stroke-width="3"/>
<rect x="155" y="674" width="190" height="69" rx="4" fill="#8aafb4"/>
<rect x="460" y="636" width="190" height="107" rx="4" fill="#69959e"/>
<rect x="765" y="600" width="190" height="143" rx="4" fill="#477785"/>
<rect x="1070" y="688" width="190" height="55" rx="4" fill="#a6bec0"/>
<g text-anchor="middle" fill="#f2f5f4"><text x="250" y="778" font-size="24" font-weight="800">第1週</text><text x="555" y="778" font-size="24" font-weight="800">第2週</text><text x="860" y="778" font-size="24" font-weight="800">第3週</text><text x="1165" y="778" font-size="24" font-weight="800">第4週</text><text x="250" y="810" font-size="18">課題を知る</text><text x="555" y="810" font-size="18">条件を変えて試す</text><text x="860" y="810" font-size="18">ゲームで使う</text><text x="1165" y="810" font-size="18">調整・振り返り</text></g>
<text x="70" y="858" font-size="18" fill="#bcd0d3">※棒の高さは実測負荷ではなく、学習の進め方を示す模式図です。</text>
<rect x="70" y="887" width="1299" height="65" rx="7" fill="#253a42"/>
<text x="94" y="916" font-size="20" font-weight="900" fill="#f4f7f6">03  1週間｜ミクロサイクル</text>
<text x="94" y="941" font-size="17" fill="#c5d6d8">練習A（技術） → 練習B（対人） → 試合・交流 → 休養・回復　※曜日・回数は実際の日程に合わせる</text>
</svg>