name: RBA Preflight QA

on:
  pull_request:
    branches:
      - main
      - preview-rba
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify deployment budget policy
        run: node scripts/check-deployment-policy.mjs

      - name: Reject legacy deploy token on main
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy]')
        run: |
          echo "::error::Legacy [deploy] commit token detected on main. Production should use the verified Preview artifact instead of a new Git-triggered build."
          exit 1

  static-checks:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deployment policy
        run: pnpm run audit:deploy-policy

      - name: TypeScript
        run: pnpm exec tsc --noEmit --pretty false

      - name: HOME COURT Japanese + iPhone regression audit
        run: pnpm run audit:homecourt-ja

      - name: Player Journey progression and safety audit
        run: pnpm run audit:player-journey

      - name: Site Japanese regression audit
        run: pnpm run audit:site-ja

      - name: D-HUB mobile and access regression audit
        run: pnpm run audit:dhub-mobile

      - name: Platform enterprise quality audit
        run: pnpm run audit:platform-quality

      - name: Member onboarding audit
        run: node audit/member-experience/onboarding-check.mjs

      - name: Email registration and safe-return audit
        run: node audit/email-registration/check.mjs

      - name: Member learning access audit
        run: node audit/member-learning/check.mjs

      - name: Member experience route/render audit
        run: node audit/member-experience/check.mjs

      - name: ESLint changed files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}" || git fetch origin "$BASE_SHA"
          git cat-file -e "$HEAD_SHA^{commit}" || git fetch origin "$HEAD_SHA"
          FILES="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" -- '*.ts' '*.tsx' '*.js' '*.mjs')"
          if [ -z "$FILES" ]; then
            echo "No changed JavaScript/TypeScript files to lint."
            exit 0
          fi
          printf '%s\n' "$FILES"
          printf '%s\n' "$FILES" | xargs pnpm exec eslint
