name: RBA acquisition funnel QA

on:
  pull_request:
    branches:
      - release/instagram-conversion-hub-20261117
    paths:
      - "app/ja/instagram/page.tsx"
      - "components/torsten-japan-landing.tsx"
      - "components/torsten-japan-landing.module.css"
      - "components/growth-click-tracking.tsx"
      - "components/programme-data.ts"
      - "audit/acquisition-funnel/**"
      - ".github/workflows/rba-acquisition-funnel-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conversion-safety:
    name: First-visit CTA and checkout safety
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify conversion paths and payment separation
        run: node audit/acquisition-funnel/check.mjs

  typescript-check:
    name: Full RBA TypeScript check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed PR commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned pnpm
        run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.25.0
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate complete TypeScript project
        run: pnpm exec tsc --noEmit --incremental false --pretty false
