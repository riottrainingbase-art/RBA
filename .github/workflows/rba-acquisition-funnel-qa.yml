name: RBA acquisition funnel QA

on:
  pull_request:
    branches:
      - release/instagram-conversion-hub-20261117
    paths:
      - "app/ja/instagram/page.tsx"
      - "components/torsten-japan-landing.tsx"
      - "components/torsten-japan-landing.module.css"
      - "components/growth-click-tracking.tsx"
      - "components/programme-data.ts"
      - "audit/acquisition-funnel/**"
      - ".github/workflows/rba-acquisition-funnel-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conversion-safety:
    name: First-visit CTA and checkout safety
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify conversion paths and payment separation
        run: node audit/acquisition-funnel/check.mjs
