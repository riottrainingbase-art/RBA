name: RBA UNITED Korea 2027 - Safety Preflight

on:
  pull_request:
    branches: [preview-rba]
    paths:
      - "app/ja/my-homecourt/united-korea-2027/**"
      - "components/my-homecourt.tsx"
      - "components/member-app.tsx"
      - "components/platform-business-pages.tsx"
      - "tests/united-korea-free-interest-safety.test.mjs"
      - ".github/workflows/united-korea-2027-qa.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate no payment activation and fee disclosures
        run: node --test tests/united-korea-free-interest-safety.test.mjs

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm exec tsc --noEmit --pretty false

      - name: ESLint changed source files
        run: pnpm exec eslint app/ja/my-homecourt/united-korea-2027/page.tsx components/my-homecourt.tsx components/member-app.tsx components/platform-business-pages.tsx tests/united-korea-free-interest-safety.test.mjs

      - name: Existing MY HOME COURT Japanese audit
        run: pnpm run audit:homecourt-ja
