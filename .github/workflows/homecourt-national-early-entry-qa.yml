name: MY HOME COURT National Early Entry QA

on:
  pull_request:
    paths:
      - "app/ja/my-homecourt/nationwide/**"
      - "components/my-homecourt.tsx"
      - "components/member-app.tsx"
      - "tests/homecourt-nationwide-entry.test.mjs"
      - ".github/workflows/homecourt-national-early-entry-qa.yml"
  push:
    branches:
      - "release/instagram-conversion-hub-20261117"
    paths:
      - "app/ja/my-homecourt/nationwide/**"
      - "components/my-homecourt.tsx"
      - "components/member-app.tsx"
      - "tests/homecourt-nationwide-entry.test.mjs"

permissions:
  contents: read

jobs:
  national-entry-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Nationwide entry and disclosure regression
        run: node --test tests/homecourt-nationwide-entry.test.mjs
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript validation
        run: pnpm exec tsc --noEmit --pretty false
      - name: Lint modified source and tests
        run: pnpm exec eslint app/ja/my-homecourt/nationwide/page.tsx components/my-homecourt.tsx tests/homecourt-nationwide-entry.test.mjs
      - name: MY HOME COURT Japanese copy audit
        run: pnpm run audit:homecourt-ja
