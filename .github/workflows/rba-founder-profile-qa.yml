name: RBA Founder Profile QA

on:
  pull_request:
    paths:
      - "components/simple-japanese-home.tsx"
      - "components/simple-japanese-home.module.css"
      - "components/founder-profile.tsx"
      - "components/founder-profile.css"
      - "components/site-frame.tsx"
      - "app/ja/about/page.tsx"
      - "app/ja/page.tsx"
      - "audit/site-japanese/check.mjs"
      - ".github/workflows/rba-founder-profile-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rba-founder-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-founder-profile:
    name: Founder identity and site regression
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c # v4.2.2
        with:
          persist-credentials: false
      - name: Verify JavaScript environment
        run: node --version
      - name: Audit Japanese site and founder visibility
        run: node audit/site-japanese/check.mjs
